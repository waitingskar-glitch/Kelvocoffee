<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f2f2" />

    <title>Kelvo Coffee | Flavoured Coffee Concentrate, Made in Mumbai</title>
    <meta
      name="description"
      content="Kelvo is flavoured coffee concentrate from Mumbai. Classic, Vanilla, Hazelnut, Caramel and alcohol-free Whiskey. Add 10 ml to hot or cold milk. One cup. Done."
    />

    <!-- Update to the live domain before launch. -->
    <link rel="canonical" href="https://kelvocoffee.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kelvo Coffee" />
    <meta property="og:title" content="Kelvo Coffee | Flavoured Coffee Concentrate, Made in Mumbai" />
    <meta
      property="og:description"
      content="Flavoured coffee concentrate in five flavours. Add 10 ml to hot or cold milk. One cup. Done."
    />
    <meta property="og:url" content="https://kelvocoffee.in/" />
    <meta property="og:image" content="https://kelvocoffee.in/assets/products/share-caramel.jpg" />
    <meta property="og:image:width" content="900" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="A pouch of Kelvo Caramel flavoured coffee concentrate" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kelvo Coffee | Flavoured Coffee Concentrate, Made in Mumbai" />
    <meta
      name="twitter:description"
      content="Flavoured coffee concentrate in five flavours. Add 10 ml to hot or cold milk. One cup. Done."
    />
    <meta name="twitter:image" content="https://kelvocoffee.in/assets/products/share-caramel.jpg" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts. The brand faces are self-hosted (see src/styles/index.css);
         preload the two that paint above the fold. Google supplies only a
         ₹-only Noto Sans subset, because none of the brand faces carries the
         rupee sign. It loads without blocking render (media swap). -->
    <link rel="preload" href="/fonts/bobby-jones-soft.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/hk-grotesk-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;800&text=%E2%82%B9&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- The hero's front pouch is the largest thing on first paint. -->
    <link
      rel="preload"
      as="image"
      href="/assets/pouches/caramel-full.webp"
      imagesrcset="/assets/pouches/caramel-320.webp 320w, /assets/pouches/caramel-full.webp 490w"
      imagesizes="(min-width: 1024px) 16vw, 42vw"
      fetchpriority="high"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kelvo Coffee",
        "alternateName": "Kelvo",
        "url": "https://kelvocoffee.in/",
        "logo": "https://kelvocoffee.in/icon-512.png",
        "description": "Flavoured coffee concentrate. Coffee, but make it your flavour.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        }
      }
    </script>
  </head>
  <body>
    <!-- Meta Pixel, for browsers without JavaScript (the script loads from src/lib/metaPixel.ts). -->
    <noscript
      ><img height="1" width="1" style="display: none" alt=""
        src="https://www.facebook.com/tr?id=3666555496838317&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
